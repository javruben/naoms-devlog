<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="760" height="420" fill="#0d1117"/>
  <text x="40" y="44" fill="#e6edf3" font-size="22" font-weight="600">NAOMS · Week 4 commits per day</text>
  <text x="40" y="68" fill="#8b949e" font-size="14">2026-04-06 → 2026-04-12 · ~3,900 commits in window · 1 canonical committer identity</text>

  <!-- y gridlines -->
